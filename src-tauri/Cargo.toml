[package]
name = "caffeine"
version = "2.0.1"
description = "A quiet, cross-platform keep-awake utility"
authors = ["Tong Lu"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[features]
desktop-smoke = []

[lib]
name = "caffeine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSPathUtilities", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
wry = { path = "vendor/wry" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
