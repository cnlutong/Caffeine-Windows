[package]
name = "caffeine"
version = "2.0.0"
description = "A quiet, cross-platform keep-awake utility"
authors = ["Tong Lu"]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[features]
desktop-smoke = []

[lib]
name = "caffeine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemServices"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
